openapi: 3.1.0
info:
  title: Aurora Motor Engine API
  description: |
    Aurora Motor Engine — Hybrid Agent Fabric Control API.
    
    Bu API, Aurora bilişsel motorunun tüm bileşenlerini yönetir:
    - Session yönetimi ve sohbet
    - Aurora hafıza grafı
    - Dünya modeli
    - Proaktif initiative motoru
    - Evrim ve skill yönetimi
    - Bilişsel orkestratör
    - Topluluk (Society) sistemi
    - Platform entegrasyonları (Telegram, Discord, Slack, vb.)
    - MCP server yönetimi
    - Öğrenme ve iyileştirme
    - Otomasyon ve zamanlama
  version: 1.65.0
  contact:
    name: Aurora Motor Engine
  license:
    name: MIT

servers:
  - url: http://localhost:3000
    description: Development server

security:
  - bearerAuth: []
  - cookieAuth: []

paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      tags: [System]
      security: []
      responses:
        '200':
          description: System health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  engine:
                    type: string
                    example: hybrid-agent-fabric
                  version:
                    type: string
                    example: 1.65.0
                  provider:
                    type: array
                    items:
                      type: object
                  sandbox:
                    type: string
                  persistence:
                    type: string

  /v1/sessions:
    post:
      summary: Create a new session
      operationId: createSession
      tags: [Sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tenantId:
                  type: string
                  default: local
                workspacePath:
                  type: string
                label:
                  type: string
                  maxLength: 200
                agentProfileId:
                  type: string
                modelOverride:
                  type: string
      responses:
        '201':
          description: Session created
    get:
      summary: List sessions
      operationId: listSessions
      tags: [Sessions]
      parameters:
        - name: tenantId
          in: query
          schema:
            type: string
            default: local
        - name: status
          in: query
          schema:
            type: string
            enum: [active, stopped, all]
            default: all
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Session list with pagination
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      type: object
                  pagination:
                    $ref: '#/components/schemas/Pagination'

  /v1/sessions/{sessionId}:
    get:
      summary: Get session details
      operationId: getSession
      tags: [Sessions]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session details
  /v1/world/entities:
    get:
      summary: List world entities
      operationId: listEntities
      tags: [World Model]
      parameters:
        - name: tenantId
          in: query
          schema:
            type: string
            default: local
        - name: scope
          in: query
          schema:
            type: string
            enum: [global, project, session, ephemeral]
      responses:
        '200':
          description: Entity list
    post:
      summary: Create or update entity
      operationId: upsertEntity
      tags: [World Model]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, name]
              properties:
                type:
                  type: string
                  enum: [person, place, project, file, task, tool, website, model, organization, document, device, service, concept, goal]
                name:
                  type: string
                  maxLength: 300
      responses:
        '201':
          description: Entity created
